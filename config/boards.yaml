# Pulp boards are per department, shared by all clients (from the links in the PM Overview sheet).
# A client row in the Config tab can override any of these; blank means use the default.
# `board` may be the full UUID, the first 8 characters seen in https://pulp.mangoeyes.io/board/<id>, or the board's
# exact name; the hub resolves it against GET /boards at run time. List names match ignoring case and punctuation
# ("To Do" = "To-Do"); a list is created only if no such list exists.
base_url: https://pulp.mangoeyes.io
# What a card link looks like in the browser. Placeholders: {base} {board} {card}. Change here if Pulp uses another shape.
card_url: "{base}/board/{board}?card={card}"   # cards open in a pop-up with no URL of their own; the board opens and ?card= stays unique per card
departments:
  seo:     { board: d4424c02-a0ee-4bec-93be-afb4d6547a88, list: "To Do", staging: "Staging" }
  content: { board: 54d3e767-8899-4875-b88f-faf45b0d82af, list: "To Do", staging: "Staging" }
  dev:     { board: 0fac54b7-3a47-4645-9d67-87f7d24ed32a, list: "To Do", staging: "Staging" }
  design:  { board: 088afc03-75da-4c0f-a7f6-a37a9208c515, list: "To Do", staging: "Staging" }
  automation: { board: ec7258b2-556c-4fcd-be34-21ed81b078e0, list: "To Do", staging: "Staging" }   # Onboarding & Automations
  video:   { board: 8f4eb438-d311-4e6a-8288-9b73bd64271b, list: "To Do", staging: "Staging" }   # Video Production sprint
  # Anything that is not a department's work is the PMs' to judge: coordination, "share the document", follow-ups,
  # internal MangoEyes items. They go to the PMs board (decision 2026-09-18; before that the Development board was the
  # catch-all and filled with cards that were not development). Named by board name; create the board "PMs" in Pulp
  # with the usual lists, the hub adds Staging if missing.
  general: { board: "PMs", list: "To Do", staging: "Staging" }
  internal: { board: "PMs", list: "To Do", staging: "Staging" }
  scope:   { board: 0fac54b7-3a47-4645-9d67-87f7d24ed32a, list: "Needs scope" }
