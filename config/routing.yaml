# Routing table. Deterministic. Edit here, not in prompts.
# department: which board family (dev | content | design | seo | automation | video | general | internal)
# gated: true → card goes to the "Needs scope" list first; a person moves it on.
# sla_days: working days from creation to due date. P1 overrides with p1_sla_hours.
# No sub-card chains: a new page is one card; the PM adds extra cards by hand if a page needs more than one person (decided 2026-09-10).

p1_sla_hours: 4
p1_keywords:
  - site is down
  - site down
  - website down
  - broken form
  - form not working
  - leads not coming
  - no leads
  - ad disapproved
  - ads disapproved
  - account disabled
  - payment failed
  - checkout not working
  - booking not working
  - "500 error"
  - hacked

request_types:
  dev_issue:
    department: dev
    sla_days: 2
    labels: [dev, bug]
  dev_feedback:
    department: dev
    sla_days: 3
    labels: [dev]
  content_feedback:
    department: content
    sla_days: 3
    labels: [content]
  content_update:
    department: content
    sla_days: 3
    labels: [content]
  graphic_issue:
    department: design
    sla_days: 2
    labels: [design]
    follow_up:
      request_type: dev_update_asset
      department: dev
      title_prefix: "Update live asset: "
  dev_update_asset:
    department: dev
    sla_days: 1
    labels: [dev, asset]
  seo_request:
    department: seo
    sla_days: 5
    labels: [seo]
  automation_request:          # CRM / GoHighLevel / email-SMS flows / integrations / onboarding steps
    department: automation
    sla_days: 3
    labels: [automation]
  video_request:               # edits, reels, shoot planning, captions, thumbnails
    department: video
    sla_days: 5
    labels: [video]
  new_page:
    department: seo
    gated: true
    sla_days: 10
    labels: [new-page]
  new_feature:
    department: dev
    gated: true
    sla_days: 10
    labels: [feature]
  general_update:
    department: general
    no_card: true
  question:
    department: general
    no_card: true
  internal_task:
    department: internal
    sla_days: 3
    labels: [internal]
  idea:
    department: internal
    no_card: true
    backlog: ideas
  decision:
    department: internal
    no_card: true
    backlog: decisions
