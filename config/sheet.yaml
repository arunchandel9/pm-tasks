# How the hub writes into each client's tab in the PM Overview sheet.
# It reads the tab's own header row and places each value under the first header matching an alias
# (case-insensitive, punctuation ignored). Headers it doesn't know are never touched.

header_row: 1
date_format: "DD-MMM-YYYY"        # 08-Sep-2026, as the sheet already uses

# New rows go above this divider when a tab has one (a merged row reading DONE / COMPLETED), else after the last filled row.
done_divider: ["done", "completed", "completed tasks"]

columns:
  serial:      ["s no", "s no.", "sr no", "sl no", "#", "no"]           # next number in sequence
  title:       ["task", "task deliverable", "task description", "title", "request"]
  pulp_link:   ["pulp link", "card link", "pulp", "card", "board link"]
  created:     ["date added", "date", "created", "created on", "added on", "received"]
  due:         ["due date", "due", "deadline", "target date"]
  priority:    ["priority", "urgency"]                                   # written once on creation, never changed
  assignee:    ["assigned to", "assignee", "owner", "responsible"]      # written once on creation if empty
  stage:       ["status", "stage", "state"]
  department:  ["department", "team", "dept"]
  notes:       ["comments", "notes", "pm notes", "remarks"]              # written once on creation with initial_note, never changed
  completed:   ["date completed", "completed", "completed on", "done on"]
  source_link: ["source link", "message link", "source"]
  trello_link: ["trello link"]                                           # recognised so it is never mistaken for the pulp link

# Written once into Comments when the row is created. Placeholders: {who} = the person who approved (or "drag in Pulp"),
# {when} = date and time in stamp_timezone, {source} = where the request came from (Slack · sender, Intake · name, /task · name).
initial_note: "Task assigned. Added by Task Hub · approved by {who} · {when} · from {source}"
stamp_timezone: "Asia/Kolkata"

# Our department keys → the labels the sheet uses
department_labels:
  dev: Development
  content: Content
  design: Graphics
  seo: SEO
  automation: Automation
  video: Video
  general: PM
  internal: PM

# Background colour for a row the hub adds (hex, or blank for none). A person checks the row is in the right place,
# then makes it white; the hub never touches the colour again.
new_row_colour: "#FFF2CC"

# Status text written at each point
stage_values:
  created: "To Do"
  done: "Done"
