# The real client map lives in the "Config" tab of the PM sheet and is mirrored into the
# clients table every minute. This file is the local-dev fallback and documents the shape.
#
# One row per client. Boards per department: board, list (target), staging, assignee.

clients:
  - id: clinic-x
    name: Clinic X
    scope: client
    slack_team_id: T0CLINICX     # the client's own workspace; every channel in it belongs to this client
    slack_channels: []           # optional explicit channel IDs (override), usually empty
    email_domains: [clinicx.co.uk]
    whatsapp_numbers: ["+447700900000"]
    client_facing_ack: false
    boards:
      dev:     { board: "board_id", list: "To Do", staging: "Staging", assignee: "dev@mangoeyesagency.com" }
      content: { board: "board_id", list: "To Do", staging: "Staging", assignee: "content@mangoeyesagency.com" }
      design:  { board: "board_id", list: "To Do", staging: "Staging", assignee: "design@mangoeyesagency.com" }
      seo:     { board: "board_id", list: "To Do", staging: "Staging", assignee: "seo@mangoeyesagency.com" }
      scope:   { board: "board_id", list: "Needs scope" }

  - id: internal
    name: MangoEyes internal
    scope: internal
    slack_team_id: T0MANGOEYES   # the home workspace
    email_domains: [mangoeyesagency.com]
    boards:
      internal: { board: "board_id", list: "To Do", staging: "Staging" }

# Staff are recognised by email domain (STAFF_EMAIL_DOMAINS), not by user ID, because IDs differ per workspace.
