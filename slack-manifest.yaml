# Paste at https://api.slack.com/apps → Create New App → From a manifest (YAML).
# Domain is already filled in. After creating: Basic Information → App Credentials → copy Client ID,
# Client Secret, Signing Secret into Vercel. Then Manage Distribution → Activate distribution,
# and install into each workspace via https://pm-tasks.vercel.app/api/slack/install
display_information:
  name: Task Hub
  description: MangoEyes Task Hub.
  background_color: "#E28F05"
features:
  bot_user:
    display_name: Task Hub
    always_online: true
  # No slash command: the app sits in client workspaces, and anything it lists under "/" is visible to clients.
  # The team files asks through Task Hub Drop, the DM and taskhub@ (removed 2026-09-15).
oauth_config:
  redirect_urls:
    - https://pm-tasks.vercel.app/api/slack/oauth
  scopes:
    bot:
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - chat:write
      - reactions:write
      - reactions:read
      - users:read
      - users:read.email
      - team:read
      - files:read
settings:
  event_subscriptions:
    request_url: https://pm-tasks.vercel.app/api/slack/events
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
    request_url: https://pm-tasks.vercel.app/api/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
